name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r fog/requirements.txt
          pip install -r cloud/requirements.txt

      - name: Verify Python files
        run: |
          python -m py_compile fog/fog_gateway.py
          python -m py_compile cloud/cloud_service.py
          python -m py_compile simulator/simulator.py
    docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build fog gateway image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/fog-gateway:v1 ./fog

      - name: Build cloud service image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-service:v1 ./cloud

      - name: Push fog gateway image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/fog-gateway:v1

      - name: Push cloud service image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-service:v1